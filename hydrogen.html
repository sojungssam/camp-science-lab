<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>수소 연소 시범 안전</title>
<meta name="description" content="중3 과학 — 수소 연소 반응 시범 실험 안전교육">
<style>
  :root{
    --bg:#f7f8fa; --card:#ffffff; --ink:#1d2330; --sub:#5b6474; --line:#e3e6ec;
    --accent:#c2410c; --accent-soft:#fff1e8;
    --warn:#c2410c; --warn-soft:#fff3ea;
    --danger:#dc2626; --danger-soft:#fdecec;
    --ok:#15803d; --ok-soft:#e8f6ed;
    --radius:18px; --scale:1;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#12151b; --card:#1b2029; --ink:#eef1f6; --sub:#a3abb9; --line:#2c3340;
      --accent:#fb923c; --accent-soft:#2e2118;
      --warn:#fb923c; --warn-soft:#2e2118;
      --danger:#f87171; --danger-soft:#2f1b1d;
      --ok:#4ade80; --ok-soft:#16281d;
    }
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{font-size:calc(clamp(17px, 0.6vw + 14px, 22px) * var(--scale))}
  body{
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.6; word-break:keep-all;
    -webkit-text-size-adjust:100%;
  }
  button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
  .wrap{max-width:1100px;margin:0 auto;padding:0 16px}

  header{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line)}
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0}
  .brand{font-weight:800;font-size:1.25rem;letter-spacing:-0.02em}
  .brand small{display:block;font-weight:500;font-size:.75rem;color:var(--sub)}
  .size{display:flex;gap:6px;flex:0 0 auto}
  .size button{min-width:52px;min-height:48px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-weight:700}
  nav{display:flex;gap:8px;overflow-x:auto;padding:0 0 12px;scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  nav button{
    flex:0 0 auto;min-height:52px;padding:0 18px;border-radius:999px;
    border:1px solid var(--line);background:var(--card);font-weight:700;white-space:nowrap
  }
  nav button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

  main{padding:28px 0 60px}
  section.page{display:none;animation:fade .25s ease}
  section.page.on{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  h1{font-size:2rem;line-height:1.3;letter-spacing:-0.03em;margin-bottom:8px}
  h2{font-size:1.45rem;letter-spacing:-0.02em;margin:36px 0 14px}
  .lead{color:var(--sub);font-size:1.05rem}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px}
  .grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}

  .badge{display:inline-block;padding:6px 14px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:800;font-size:.9rem;margin-bottom:12px}
  .rules{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
  .rule{display:flex;gap:14px;align-items:flex-start}
  .rule .num{flex:0 0 auto;width:44px;height:44px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:800;font-size:1.2rem}
  .rule b{display:block;font-size:1.1rem}
  .rule span{color:var(--sub);font-size:.95rem}

  .danger-card{border-left:6px solid var(--danger)}
  .danger-card .ico{font-size:2rem}
  .danger-card b{display:block;font-size:1.1rem;margin:6px 0 4px}
  .danger-card p{color:var(--sub);font-size:.95rem}

  .mat{display:flex;flex-wrap:wrap;gap:8px}
  .mat span{padding:8px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-size:.95rem}

  .check{display:grid;gap:10px}
  .check label{
    display:flex;gap:14px;align-items:center;padding:16px 18px;min-height:60px;
    border:1px solid var(--line);border-radius:14px;background:var(--card);cursor:pointer;font-size:1.05rem;
    transition:background .15s,border-color .15s
  }
  .check input{width:28px;height:28px;flex:0 0 auto;accent-color:var(--ok)}
  .check label.done{background:var(--ok-soft);border-color:var(--ok)}
  .status{margin-top:14px;padding:18px;border-radius:14px;font-weight:800;font-size:1.15rem;text-align:center;background:var(--warn-soft);color:var(--warn)}
  .status.ready{background:var(--ok-soft);color:var(--ok)}
  .row-end{display:flex;justify-content:flex-end;margin-top:16px}

  .stepper{padding:0;overflow:hidden}
  .bar{height:8px;background:var(--line)}
  .bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
  .step-body{padding:28px;min-height:260px}
  .step-no{color:var(--accent);font-weight:800;font-size:.95rem}
  .step-title{font-size:1.7rem;font-weight:800;letter-spacing:-0.02em;margin:4px 0 12px}
  .step-desc{font-size:1.2rem}
  .warnbox{margin-top:18px;padding:18px 20px;border-radius:14px;background:var(--warn-soft);color:var(--warn);font-weight:600;font-size:1.08rem;display:flex;gap:12px}
  .warnbox::before{content:"⚠️";flex:0 0 auto}
  .step-nav{display:flex;justify-content:space-between;gap:10px;padding:0 28px 28px}
  .btn{min-height:56px;padding:0 26px;border-radius:14px;font-weight:800;font-size:1.05rem;border:1px solid var(--line);background:var(--card)}
  .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btn:disabled{opacity:.35;cursor:default}
  .dots{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:0 28px 22px}
  .dots button{width:16px;height:16px;border-radius:50%;background:var(--line)}
  .dots button.on{background:var(--accent)}

  .em b{display:flex;gap:10px;align-items:center;font-size:1.2rem;margin-bottom:10px}
  .em ol{padding-left:1.3em}
  .em li{margin:4px 0}
  .callout{margin-top:20px;padding:22px;border-radius:var(--radius);background:var(--danger-soft);color:var(--danger);font-weight:800;font-size:1.2rem;text-align:center}

  footer{color:var(--sub);font-size:.85rem;text-align:center;padding:30px 0}

  @media (max-width:600px){
    h1{font-size:1.6rem}
    .brand{font-size:1.05rem}
    .step-body{padding:22px}
    .step-nav{padding:0 22px 22px}
    .step-title{font-size:1.4rem}
    .btn{padding:0 18px;flex:1}
  }
  @media print{header,nav,.step-nav,.dots,.size,.row-end{display:none}section.page{display:block!important}}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="top">
      <div class="brand">🔥 수소 연소 시범 안전<small>중학교 3학년 과학 · 실험 안전 교실</small></div>
      <div class="size" aria-label="글자 크기">
        <button id="fontDown" aria-label="글자 작게">가−</button>
        <button id="fontUp" aria-label="글자 크게">가+</button>
      </div>
    </div>
    <nav id="tabs" role="tablist">
      <button data-go="safety" aria-selected="true">📋 안전 수칙</button>
      <button data-go="emergency">🚨 응급 대처</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <section class="page on" id="safety"></section>
  <section class="page" id="emergency"></section>
</main>

<footer>실험은 반드시 선생님의 지도 아래에서 진행합니다.</footer>

<script>
const DATA = {
  "badge": "선생님 시범 실험",
  "emoji": "🔥",
  "title": "수소의 연소 반응",
  "goal": "선생님의 시범 실험을 안전하게 관찰하고, 수소가 연소할 때 나타나는 변화를 관찰할 수 있다.",
  "rules": [
    [
      "자리 지키기",
      "정해진 관람 위치에 앉아서 관찰하기"
    ],
    [
      "신호 따르기",
      "선생님 신호에 맞춰 귀 막기"
    ],
    [
      "만지지 않기",
      "풍선과 시범 도구는 절대 만지지 않기"
    ],
    [
      "즉시 알리기",
      "몸이 불편하면 바로 선생님께 말하기"
    ]
  ],
  "dangers": [
    {
      "ico": "💥",
      "t": "큰 소리와 불꽃",
      "d": "풍선에 불이 붙으면 큰 소리와 순간적인 불꽃이 생길 수 있어요."
    },
    {
      "ico": "📏",
      "t": "거리 유지",
      "d": "학생은 선생님이 정한 관람 위치에서만 관찰해요. 시범대 가까이 가지 않아요."
    },
    {
      "ico": "🎈",
      "t": "풍선 만지지 않기",
      "d": "수소 풍선은 불이 붙기 쉬워요. 만지거나 끈을 당기지 않아요."
    },
    {
      "ico": "🔥",
      "t": "남은 조각 주의",
      "d": "타고 남은 풍선 조각은 뜨거울 수 있어요. 선생님이 치울 때까지 만지지 않아요."
    }
  ],
  "checklist": [
    "선생님이 정한 관람 위치에 앉았어요",
    "선생님 신호에 맞춰 귀를 막을 준비가 되었어요",
    "시범대 앞으로 나가지 않기로 약속했어요"
  ],
  "emergency": [
    {
      "i": "♨️",
      "t": "화상을 입었을 때",
      "s": [
        "즉시 흐르는 시원한 물에 15분 이상 식혀요",
        "물집은 터뜨리지 않아요",
        "선생님께 알리고 보건실로 가요"
      ]
    },
    {
      "i": "👂",
      "t": "큰 소리에 귀가 아플 때",
      "s": [
        "조용한 곳에서 잠시 쉬어요",
        "귀가 계속 먹먹하면 선생님께 알려요",
        "보건실에서 확인받아요"
      ]
    },
    {
      "i": "🔥",
      "t": "불이 옮겨붙었을 때",
      "s": [
        "“불이야!” 크게 외쳐요",
        "선생님이 물·소화기로 꺼요",
        "학생은 선생님 안내에 따라 침착하게 대피해요"
      ]
    },
    {
      "i": "👁️",
      "t": "눈에 이물질이 들어갔을 때",
      "s": [
        "눈을 비비지 않아요",
        "흐르는 물로 충분히 씻어요",
        "바로 선생님께 알려요"
      ]
    }
  ]
};

/* ---------- 안전 수칙 ---------- */
function renderSafety(){
  const x = DATA;
  document.getElementById("safety").innerHTML = `
    <span class="badge">${x.badge}</span>
    <h1>${x.emoji} ${x.title}</h1>
    <p class="lead">🎯 ${x.goal}</p>

    <h2>🤝 우리의 약속</h2>
    <div class="rules">${x.rules.map((r,i)=>`
      <div class="card rule"><div class="num">${i+1}</div><div><b>${r[0]}</b><span>${r[1]}</span></div></div>`).join("")}
    </div>

    <h2>⚠️ 이 실험의 위험 요소</h2>
    <div class="grid">${x.dangers.map(d=>`
      <div class="card danger-card"><div class="ico">${d.ico}</div><b>${d.t}</b><p>${d.d}</p></div>`).join("")}
    </div>

    <h2>✅ 실험 전 안전 점검</h2>
    <div class="check" id="check">${x.checklist.map(c=>`
      <label><input type="checkbox"><span>${c}</span></label>`).join("")}
    </div>
    <div class="status" id="status"></div>
    <div class="row-end">
      <button class="btn" id="reset">↺ 점검 초기화</button>
    </div>
  `;
  const box = document.getElementById("check");
  const status = document.getElementById("status");
  const update = () => {
    const all = box.querySelectorAll("input");
    const n = [...all].filter(c=>c.checked).length;
    all.forEach(c=>c.closest("label").classList.toggle("done", c.checked));
    const ready = n === all.length;
    status.textContent = ready
      ? "🟢 모든 점검 완료! 실험을 시작할 수 있어요"
      : `🟠 점검 중 (${n} / ${all.length}) — 모두 확인해야 시작해요`;
    status.classList.toggle("ready", ready);
  };
  box.addEventListener("change", update);
  document.getElementById("reset").onclick = () => { box.querySelectorAll("input").forEach(c=>c.checked=false); update(); };
  update();
}

/* ---------- 응급 대처 ---------- */
function renderEmergency(){
  document.getElementById("emergency").innerHTML = `
    <h1>🚨 이럴 땐 이렇게!</h1>
    <p class="lead">당황하지 말고, 먼저 주변에 크게 알리고 선생님을 부르세요.</p>
    <div class="grid" style="margin-top:20px">${DATA.emergency.map(e=>`
      <div class="card em"><b><span style="font-size:1.6rem">${e.i}</span>${e.t}</b>
      <ol>${e.s.map(s=>`<li>${s}</li>`).join("")}</ol></div>`).join("")}
    </div>
    <div class="callout">어떤 사고든 → ① 멈추기 ② 크게 알리기 ③ 선생님 부르기</div>`;
}

/* ---------- 탭 이동 ---------- */
function go(id){
  document.querySelectorAll("section.page").forEach(s=>s.classList.toggle("on", s.id===id));
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-selected", b.dataset.go===id));
  window.scrollTo({top:0, behavior:"smooth"});
  history.replaceState(null, "", "#"+id);
}
document.addEventListener("click", e=>{
  const t = e.target.closest("[data-go]");
  if(t) go(t.dataset.go);
});

/* ---------- 글자 크기 ---------- */
let scale = 1;
const setScale = v => {
  scale = Math.min(1.6, Math.max(0.8, Math.round(v*10)/10));
  document.documentElement.style.setProperty("--scale", scale);
};
document.getElementById("fontUp").onclick = ()=>setScale(scale+0.1);
document.getElementById("fontDown").onclick = ()=>setScale(scale-0.1);

/* ---------- 시작 ---------- */
renderSafety(); renderEmergency();
const start = location.hash.slice(1);
if(document.getElementById(start)) go(start);
</script>
</body>
</html>
